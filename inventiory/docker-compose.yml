services:
  mysql:
    image: mysql:8.0
    container_name: inventiory-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: inventiory_thymeleaf
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    build: .
    container_name: inventiory-app
    ports:
      - "5000:5000"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/inventiory_thymeleaf?serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - mysql

volumes:
  mysql-data:
